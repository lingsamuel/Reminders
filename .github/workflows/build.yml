name: Build and Release Windows
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate release scripts
        run: |
          node --test scripts/check-release-version.test.mjs scripts/create-release.test.mjs scripts/prune-build-artifacts.test.mjs
          bash -n scripts/create-release.sh scripts/publish-cross.sh
      - name: Check consistent versions and release tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"
  build:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Reminders.Desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Test core and persistence
        run: dotnet test tests/Reminders.Tests -c Release
      - name: Test backend protocol
        run: dotnet test tests/Reminders.Windows.Tests/Protocol/Reminders.Protocol.Tests.csproj -c Release
      - name: Test React editor
        working-directory: src/Reminders.Desktop
        run: |
          npm ci
          npm test
      - name: Build solution
        run: dotnet build Reminders.slnx -c Release
      - name: Verify WPF offscreen without desktop input
        run: dotnet run --project tests/Reminders.Windows.Tests -c Release --no-build -- artifacts/offscreen
      - name: Verify real backend stdio without desktop input
        shell: pwsh
        run: ./scripts/verify-backend.ps1 -BackendPath "$pwd/src/Reminders.Windows/bin/Release/net10.0-windows/Reminders.Backend.dll"
      - name: Publish Windows x64
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Test Rust protocol and window coordination
        working-directory: src/Reminders.Desktop/src-tauri
        run: cargo test --locked
      - uses: actions/upload-artifact@v7
        with:
          name: Reminders-win-x64
          path: artifacts/Reminders-*-win-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: Reminders-installer
          path: src/Reminders.Desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: offscreen-previews
          path: artifacts/offscreen/*.png
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: Reminders-win-x64
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: Reminders-installer
          path: release-assets
      - name: Publish tag release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/create-release.sh "$RELEASE_TAG" release-assets
